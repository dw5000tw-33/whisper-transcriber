name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            $compiler = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found."
          }
          & $compiler "windows-installer\33Works-Whisper.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: 33Works-Whisper-Windows-Installer
          path: windows-installer/dist/33Works-Whisper-Setup.exe
          if-no-files-found: error
